<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선배 연락 요청 | BigData Alumni Network</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><small>한국폴리텍대학 서울강서캠퍼스</small>빅데이터소프트웨어공학과</a><button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button><nav class="site-nav"><a href="index.html">홈</a><a href="index.html#alumni">졸업생 찾기</a><a href="alumni.html">내 정보 등록/수정</a></nav></div></header><main class="section"><div class="container"><h1 class="section-title" id="contact-title">선배에게 연락 요청</h1><p>선배의 연락처는 공개되지 않으며, 아래 내용을 서비스가 이메일로 전달합니다.</p><div id="contact-status" class="status">대상 졸업생을 확인하는 중입니다.</div><form id="contact-form" class="form-section" hidden><div class="form-grid"><div class="field"><label for="requester-name">이름 <span class="required">*</span></label><input id="requester-name" name="requester_name" required maxlength="40"></div><div class="field"><label for="requester-type">요청자 구분 <span class="required">*</span></label><select id="requester-type" name="requester_type" required><option value="">선택</option><option>재학생</option><option>졸업생</option></select></div><div class="field"><label for="requester-id">학번 또는 졸업연도</label><input id="requester-id" name="requester_student_id_or_year" maxlength="30"></div><div class="field"><label for="requester-email">이메일 <span class="required">*</span></label><input id="requester-email" name="requester_email" type="email" required maxlength="120"></div><div class="field"><label for="requester-phone">휴대전화</label><input id="requester-phone" name="requester_phone" type="tel" maxlength="20" placeholder="010-0000-0000"></div><div class="field"><label for="category">문의 분야 <span class="required">*</span></label><select id="category" name="category" required><option value="">선택</option><option>취업 준비</option><option>회사 정보</option><option>직무 상담</option><option>개발 공부</option><option>AI</option><option>빅데이터</option><option>클라우드</option><option>대학원 진학</option><option>자격증</option><option>포트폴리오</option><option>면접</option><option>기타</option></select></div><div class="field span-2"><label for="subject">문의 제목 <span class="required">*</span></label><input id="subject" name="subject" required minlength="2" maxlength="100"></div><div class="field span-2"><label for="message">문의 내용 <span class="required">*</span></label><textarea id="message" name="message" required minlength="20" maxlength="1500"></textarea><span class="hint">20~1,500자로 작성해 주세요.</span></div><div class="field span-2"><span class="field-label">선배에게 전달할 연락처 <span class="required">*</span></span><div class="checks"><label class="check"><input type="radio" name="share_contact" value="email" required>이메일만</label><label class="check"><input type="radio" name="share_contact" value="phone">휴대전화만</label><label class="check"><input type="radio" name="share_contact" value="both">모두</label></div></div><div class="field span-2"><label class="check"><input type="checkbox" name="website" tabindex="-1" autocomplete="off"> <span class="sr-only">웹사이트</span></label></div></div><button id="contact-submit" type="submit">선배에게 연락 요청 보내기</button></form></div></main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/common.js"></script><script src="js/contact.js"></script></body></html>
