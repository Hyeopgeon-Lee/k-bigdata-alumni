<main><section class="hero"><div class="container"><p>빅데이터소프트웨어공학과 동문 서비스</p><h1>선배와 후배를 잇는<br>동문 네트워크</h1><p>졸업생의 진로 경험과 선배가 공유한 채용정보를 확인하고, 필요할 때 안전하게 소통하세요.</p></div></section>

<section class="section" id="alumni"><div class="container"><h2 class="section-title">졸업생 찾기</h2><div class="panel"><form id="search-form"><div class="search-row"><div class="field"><label class="sr-only" for="query">검색</label><input id="query" type="search" placeholder="이름, 회사, 직무, 대학원, 연구분야, 주요 기술 검색"></div><button type="submit">검색</button></div><button class="filter-toggle" type="button" aria-expanded="false">상세 필터 열기</button><div class="filters filter-grid"><div class="field"><label for="graduation-year">졸업연도</label><select id="graduation-year"></select></div><div class="field"><label for="employment-status">취업 여부</label><select id="employment-status"><option value="">전체</option><option>취업 중</option><option>대학원 준비중</option><option>대학원 연구실(석사과정)</option><option>대학원 연구실(박사과정)</option><option>구직 중</option><option>미취업</option><option>기타</option></select></div><div class="field"><label for="graduate-status">대학원 상태</label><select id="graduate-status"><option value="">전체</option><option>진학하지 않음</option><option>진학 예정(준비중)</option><option>재학</option><option>휴학</option><option>수료</option><option>졸업</option></select></div><div class="field"><label for="graduate-school-type">대학원 구분</label><select id="graduate-school-type"><option value="">전체</option><option>일반대학원</option><option>전문대학원</option><option>특수대학원</option></select></div><div class="field"><label for="graduate-degree">학위과정</label><select id="graduate-degree"><option value="">전체</option><option>석사</option><option>박사</option><option>석박사통합</option></select></div><div class="field"><label for="mentoring-topic">상담 가능 분야</label><select id="mentoring-topic"><option value="">전체</option><option>취업 준비</option><option>회사 정보</option><option>직무 상담</option><option>개발 공부</option><option>AI</option><option>빅데이터</option><option>클라우드</option><option>대학원 진학</option><option>자격증</option><option>포트폴리오</option><option>면접</option><option>기타</option></select></div><div class="field"><label for="contact-allowed">연락 요청</label><select id="contact-allowed"><option value="">전체</option><option value="true">가능</option><option value="false">불가</option></select></div><div class="field"><label>&nbsp;</label><button type="button" class="button--ghost" id="reset-filter">조건 초기화</button></div></div></form></div><div id="list-status" class="status">졸업생 정보를 불러오는 중입니다.</div><div id="alumni-list" class="cards" aria-live="polite"></div></div></section></main>
