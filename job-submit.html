<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>채용정보 등록 | BigData Alumni Network</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><small>한국폴리텍대학 서울강서캠퍼스</small>빅데이터소프트웨어공학과</a><button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button><nav class="site-nav"><a href="index.html">홈</a><a href="index.html#alumni">졸업생 찾기</a><a href="jobs.html">채용정보</a><a href="alumni.html">내 정보 등록/수정</a></nav></div></header><main class="section"><div class="container narrow"><h1 class="section-title">채용정보 등록하기</h1><p>등록된 졸업생만 채용정보를 공유할 수 있으며, 관리자 승인 후 공개됩니다.</p><section id="job-auth" class="panel"><h2>1. 본인 확인</h2><div class="form-grid"><div class="field"><label for="job-alumni-id">Alumni ID</label><input id="job-alumni-id" maxlength="40" autocomplete="username"></div><div class="field"><label for="job-pin">수정 PIN</label><input id="job-pin" type="password" inputmode="numeric" minlength="6" maxlength="12" autocomplete="current-password"></div></div><button id="job-auth-button" type="button">본인 확인</button></section><div id="job-submit-status" class="status" hidden></div><form id="job-submit-form" hidden><section class="form-section"><h2>2. 채용정보</h2><div class="form-grid"><div class="field"><label>회사명 <span class="required">*</span></label><input name="company" maxlength="100" required></div><div class="field"><label>채용 직무 <span class="required">*</span></label><input name="job_title" maxlength="100" required></div><div class="field"><label>채용 구분 <span class="required">*</span></label><select name="recruit_type" required><option value="">선택</option><option>신입</option><option>경력</option><option>신입·경력</option></select></div><div class="field"><label>고용 형태 <span class="required">*</span></label><select name="employment_type" required><option value="">선택</option><option>정규직</option><option>계약직</option><option>인턴</option><option>기타</option></select></div><div class="field"><label>근무지역</label><input name="location" maxlength="100"></div><div class="field"><label>채용공고 URL <span class="required">*</span></label><input name="job_url" type="url" placeholder="https://" maxlength="500" required></div><div class="field"><label>마감일</label><input name="deadline" type="date"></div><label class="check field-check"><input name="always_open" type="checkbox">상시채용</label><div class="field span-2"><label>주요 기술</label><input name="skills" maxlength="300" placeholder="Java, Spring Boot, SQL처럼 쉼표로 구분"></div><div class="field span-2"><label>선배의 한마디</label><textarea name="alumni_comment" maxlength="800" placeholder="후배에게 이 공고를 추천하는 이유나 준비 팁을 알려주세요."></textarea></div><div class="field"><label>채용정보 유형</label><select name="referral_available"><option value="false">일반 채용정보</option><option value="true">사내추천 가능</option></select></div><div class="field"><label>공고 문의</label><select name="contact_allowed"><option value="true">문의 가능</option><option value="false">문의 불가</option></select></div></div><button id="job-submit-button" type="submit">채용정보 등록 신청</button></section></form></div></main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/common.js"></script><script src="js/job-submit.js"></script></body></html>
