<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동문소식 등록 | BigData Alumni Network</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/news.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><small>한국폴리텍대학 서울강서캠퍼스</small>빅데이터소프트웨어공학과</a><button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button><nav class="site-nav"><a href="index.html">홈</a><a href="index.html#alumni">졸업생 찾기</a><a href="jobs.html">채용정보</a><a href="news.html">동문소식</a><a href="alumni.html">내 정보 등록/수정</a></nav></div></header><main class="section"><div class="container narrow"><h1 class="section-title">동문소식 등록</h1><p>등록된 졸업생이 신청할 수 있으며, 관리자 승인 후 공개됩니다.</p><section id="news-auth" class="panel"><h2>1. 본인 확인</h2><div class="form-grid"><div class="field"><label for="news-alumni-id">Alumni ID</label><input id="news-alumni-id" maxlength="40" autocomplete="username"></div><div class="field"><label for="news-pin">수정 PIN</label><input id="news-pin" type="password" inputmode="numeric" minlength="6" maxlength="12" autocomplete="current-password"></div></div><button id="news-auth-button" type="button">본인 확인</button></section><div id="news-submit-status" class="status" hidden></div><form id="news-submit-form" hidden><section class="form-section"><h2>2. 동문소식</h2><div class="form-grid"><div class="field"><label>소식 종류 <span class="required">*</span></label><select name="news_type" required><option value="">선택</option><option value="EMPLOYMENT">취업</option><option value="JOB_CHANGE">이직</option><option value="PROMOTION">승진·보직</option><option value="STARTUP">창업</option><option value="GRADUATE_SCHOOL">대학원·학위</option><option value="ACHIEVEMENT">수상·성과</option><option value="MARRIAGE">결혼</option><option value="BIRTH_SON">득남</option><option value="BIRTH_DAUGHTER">득녀</option><option value="OBITUARY">부고</option><option value="OTHER">기타</option></select></div><div class="field"><label>제목 <span class="required">*</span></label><input name="title" maxlength="120" required></div><div class="news-conditional span-2" data-types="OBITUARY" hidden><div class="field"><label>부고 대상 동문 <span class="required">*</span></label><input id="target-query" placeholder="이름, 졸업연도, 회사 검색"><button id="target-search" type="button" class="button--secondary">대상 동문 검색</button><input name="target_alumni_id" type="hidden"><div id="target-results" class="news-target-results"></div></div><div class="field"><label>고인과의 관계</label><select name="relationship"><option value="">선택</option><option>본인</option><option>부친</option><option>모친</option><option>배우자</option><option>자녀</option><option>조부</option><option>조모</option><option>장인</option><option>장모</option><option>기타</option></select><input name="relationship_other" maxlength="60" placeholder="기타 관계" hidden></div></div><div class="news-conditional field" data-types="EMPLOYMENT JOB_CHANGE PROMOTION STARTUP"><label>회사 또는 서비스명</label><input name="company" maxlength="100"></div><div class="news-conditional field" data-types="EMPLOYMENT JOB_CHANGE"><label>직무</label><input name="job_title" maxlength="100"></div><div class="news-conditional field" data-types="PROMOTION"><label>새 직책·보직</label><input name="position_title" maxlength="100"></div><div class="news-conditional field" data-types="ACHIEVEMENT"><label>관련 기관</label><input name="organization" maxlength="120"></div><div class="news-conditional field" data-types="GRADUATE_SCHOOL"><label>대학원명</label><input name="school_name" maxlength="120"></div><div class="news-conditional field" data-types="GRADUATE_SCHOOL"><label>학위 또는 과정</label><input name="degree_or_program" maxlength="120"></div><div class="field"><label id="event-date-label">관련 날짜</label><input name="event_date" type="date"></div><div class="news-conditional field" data-types="MARRIAGE OBITUARY"><label id="location-label">장소</label><input name="location" maxlength="200"></div><div class="field span-2"><label>외부 안내 URL</label><input name="external_url" type="url" maxlength="500" placeholder="https://"></div><div class="field span-2"><label>내용 <span class="required">*</span></label><textarea name="content" maxlength="2000" required></textarea></div><label class="check span-2"><input name="mail_requested" type="checkbox">동문들에게 이메일로 알려주세요.</label><p class="hint span-2">이메일 요청 여부와 관계없이 관리자 최종 승인 후에만 게시·발송됩니다.</p></div><button id="news-submit-button" type="submit">동문소식 등록 신청</button></section></form></div></main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/common.js"></script><script src="js/news-submit.js"></script></body></html>
