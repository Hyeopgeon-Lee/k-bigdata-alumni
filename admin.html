<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>관리자 | BigData Alumni Network</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin-responsive.css"><link rel="stylesheet" href="css/news.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><small>BigData Alumni Network</small>관리자</a></div></header><main class="section"><div class="container"><h1 class="section-title">관리자</h1><div id="admin-login" class="panel"><p>등록된 관리자 Google 계정으로 로그인하세요. 권한은 서버에서 매 요청마다 검증됩니다.</p><div id="google-signin"></div><details><summary>로그인 문제 해결</summary><div class="field"><label for="admin-token">Google ID 토큰 직접 입력</label><input id="admin-token" type="password" autocomplete="off"></div><button id="admin-load" type="button">관리 데이터 불러오기</button></details></div><div id="admin-status" class="status" hidden></div><div id="admin-app" hidden><div class="tabs admin-tabs"><button data-view="alumni" aria-selected="true">졸업생 관리</button><button data-view="jobs" aria-selected="false">채용정보 관리</button><button data-view="news" aria-selected="false">동문소식 관리</button><button data-view="requests" aria-selected="false">연락 요청</button><button data-view="mail_logs" aria-selected="false">메일 발송 기록</button></div><div class="panel"><div class="filter-grid"><div class="field"><label for="admin-query">검색</label><input id="admin-query" placeholder="이름, 회사, 직무, 제목"></div><div class="field"><label for="admin-status-filter">상태</label><select id="admin-status-filter"><option value="">전체</option><option>PENDING</option><option>APPROVED</option><option>REJECTED</option><option>HIDDEN</option><option>EXPIRED</option><option>SENT</option><option>PARTIAL_FAILED</option><option>FAILED</option><option>QUOTA_BLOCKED</option></select></div><div class="field"><label for="admin-year">졸업연도</label><select id="admin-yea
